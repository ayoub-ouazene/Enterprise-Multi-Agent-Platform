<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Orchestra logo">
  <defs>
    <linearGradient id="orch-hub" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="orch-orbit" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Outer orbit ring -->
  <ellipse cx="60" cy="60" rx="48" ry="20" transform="rotate(-30 60 60)" stroke="url(#orch-orbit)" stroke-width="2.5" opacity="0.45" fill="none"/>
  <!-- Inner orbit ring -->
  <ellipse cx="60" cy="60" rx="48" ry="20" transform="rotate(30 60 60)" stroke="url(#orch-orbit)" stroke-width="2.5" opacity="0.45" fill="none"/>
  <!-- Orbiting agent nodes (5 departments) -->
  <circle cx="60" cy="12" r="7" fill="url(#orch-orbit)"/>
  <circle cx="101.4" cy="45" r="7" fill="url(#orch-orbit)"/>
  <circle cx="85.8" cy="101" r="7" fill="url(#orch-orbit)"/>
  <circle cx="34.2" cy="101" r="7" fill="url(#orch-orbit)"/>
  <circle cx="18.6" cy="45" r="7" fill="url(#orch-orbit)"/>
  <!-- Connection lines from hub to nodes -->
  <line x1="60" y1="60" x2="60" y2="12" stroke="url(#orch-orbit)" stroke-width="1.5" opacity="0.35"/>
  <line x1="60" y1="60" x2="101.4" y2="45" stroke="url(#orch-orbit)" stroke-width="1.5" opacity="0.35"/>
  <line x1="60" y1="60" x2="85.8" y2="101" stroke="url(#orch-orbit)" stroke-width="1.5" opacity="0.35"/>
  <line x1="60" y1="60" x2="34.2" y2="101" stroke="url(#orch-orbit)" stroke-width="1.5" opacity="0.35"/>
  <line x1="60" y1="60" x2="18.6" y2="45" stroke="url(#orch-orbit)" stroke-width="1.5" opacity="0.35"/>
  <!-- Central hub (owner/router) -->
  <circle cx="60" cy="60" r="22" fill="url(#orch-hub)"/>
  <circle cx="60" cy="60" r="22" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <circle cx="60" cy="60" r="7" fill="white" opacity="0.95"/>
</svg>
